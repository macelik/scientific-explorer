  <script id="guide-data" type="application/json">{"methods":[{"id":"A1","name":"epiAneufinder / pyEpiAneufinder","category":"A","tagline":"A depth profile is corrected for bias, segmented, and classified relative to the cell.","steps":[{"title":"Prepare","text":"Bin and GC-correct scATAC depth, filter unreliable cells and bins, and form cluster pseudobulk profiles."},{"title":"Propose","text":"Recursively search eligible split positions for the strongest Anderson–Darling (AD) difference, respecting minimum segment sizes."},{"title":"Test","text":"Accept a proposed split only when local and genome-pool global permutation tests meet the configured criterion; recurse on accepted segments."},{"title":"Assign","text":"Use the original pyEpi assign_gainloss_new with genome-wide fitted best_s to assign relative per-cell states on the resulting segments."},{"title":"Explore separately","text":"The app’s optional adjacent-segment merging and re-calling is an exploratory transformation, not an implicit step of baseline segmentation."}],"example":{"title":"A candidate boundary across many bins","setup":"Illustratively, four consecutive stretches each contain many bins; their corrected mean depths are approximately 10, 11, 5 and 5.","steps":["Search eligible positions in the full bin-level profile, subject to size constraints.","A split near the change from the second to third stretch is a candidate; local and genome-pool permutations determine acceptance.","If accepted, recursively examine resulting segments, then fit best_s and assign relative states."],"interpretation":"The block means alone cannot determine whether a split passes either test; an accepted lower segment is a relative signal, not an absolute copy count."},"adaptation":{"stage":"segment","available":["Existing pyEpi binned depth and relative calls","AD segmentation baseline"],"needed":["Counting-unit and bin provenance","Independent truth or realistic simulations"],"first_experiment":"Inspect low-depth segments across coverage thresholds and record seeds for any subsampling.","success":"Report stability and uncertainty against independent evidence, without treating agreement as truth."},"cautions":["Sparse accessibility can resemble loss.","Category 0 means relative loss, not zero copies.","MCF10-A is a nonmalignant development sample, not a diploid label."],"sources":[{"title":"epiAneufinder paper","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10511508/"},{"title":"pyEpiAneufinder","url":"https://github.com/colomemaria/pyEpiAneufinder"}],"demo":"depth","record":{"name":"epiAneufinder / pyEpiAneufinder","assay":"scATAC","inputs":"BAM/fragments or binned counts; GC and blacklist metadata","outputs":"Relative loss/base/gain; breakpoints and AD scores","mechanism":"Per-cell binned depth, GC LOESS, iterative AD segmentation; no allele pooling","reference_requirements":"Genome-wide mean per cell; no normal required; no absolute ploidy","low_coverage_handling":"Filters low-coverage cells and bins >85% zeros; sparse counts can create false loss","homozygous_deletion":"No: loss is relative category, not zero copies","evidence":"Published scATAC; 100 kb bins, downsampled SNU601; py version beta","implementation":{"code_url":"https://github.com/colomemaria/pyEpiAneufinder","version_or_commit":"pyproject.toml on main declares 0.3.7, accessed 2026-10-29; commit not pinned","license":"GPL-3.0-only","license_url":"https://github.com/colomemaria/pyEpiAneufinder/blob/main/LICENSE","compute_notes":"No execution or benchmark; runtime depends on cells and genomic resolution."},"fit":"Existing data and caller provide a directly relevant baseline","limitations":["Absolute biological truth and calibration cannot be inferred from agreement.","Exact uncertainty, state limits and tested resolution need further source audit where not stated."],"source_ids":["epi","py","pyproject"],"uncertain":["Exact commit, resources and detailed missing-data behavior not verified"]},"originalName":"epiAneufinder / pyEpiAneufinder","kind":"Current baseline"},{"id":"A2","name":"Copy-scAT","category":"A","tagline":"Chromosome-scale scATAC coverage is normalized and assessed for broad and focal alterations.","steps":[{"title":"Bin","text":"Count fragments in genomic bins for each cell."},{"title":"Filter","text":"Remove low-quality cells and bins that are mostly zero."},{"title":"Normalize","text":"Adjust for library size and relevant baseline effects."},{"title":"Assess","text":"Evaluate chromosome-arm coverage for broad gains and losses; use a separate focal amplification analysis."}],"example":{"title":"Arm-level comparison","setup":"Illustrative normalized bins on one arm are 0.7, 0.8, 0.7, versus a baseline near 1.","steps":["Aggregate the arm’s usable bins.","Compare its signal with the chosen within-sample baseline.","Check whether a narrow peak warrants separate focal analysis."],"interpretation":"The broad decrease is a candidate relative loss, subject to coverage and baseline checks."},"adaptation":{"stage":"segment","available":["Existing ATAC binned depth","Relative calls for comparison"],"needed":["Compatible fragment inputs and matching bin definitions","Documented baseline settings"],"first_experiment":"Run a small matched-cell comparison after confirming input availability.","success":"Describe arm-level agreement and discordance by coverage, without calling either tool truth."},"cautions":["Default resolution is coarse and focal analysis is distinct.","No validated absolute or biallelic deletion call follows from low signal.","Fragments were not established as available in this workspace."],"sources":[{"title":"Copy-scAT paper","url":"https://doi.org/10.1126/sciadv.abg6045"},{"title":"Copy-scAT repository","url":"https://github.com/spcdot/CopyscAT"}],"demo":"depth","record":{"name":"Copy-scAT (CopyscAT)","assay":"scATAC","inputs":"10x fragments; genomic bins; optional baseline corrections","outputs":"Relative large-scale CNA and focal amplification","mechanism":"Depth pileups, library normalization, bin filtering, chromosome-arm and focal analysis","reference_requirements":"No external control required; baseline correction has assumptions","low_coverage_handling":"Default 5,000 fragments/cell, 1 Mb bins; discard bins >=80% zero","homozygous_deletion":"No explicit validated biallelic deletion state found","evidence":"Published scATAC; default arm-level calls; focal amplification separate","implementation":{"code_url":"https://github.com/spcdot/CopyscAT","version_or_commit":"Repository default branch inspected 2026-10-29; exact commit not pinned","license":"GPL-3.0-or-later","license_url":"https://github.com/spcdot/CopyscAT/blob/master/gpl_license.txt","compute_notes":"No execution or benchmark; runtime depends on cells and genomic resolution."},"fit":"Useful comparator, but fragments not located and coarser default","limitations":["Absolute biological truth and calibration cannot be inferred from agreement.","Exact uncertainty, state limits and tested resolution need further source audit where not stated."],"source_ids":["copy","copycode"],"uncertain":["Exact commit, resources and detailed missing-data behavior not verified"]},"originalName":"Copy-scAT (CopyscAT)","kind":"Published comparator"},{"id":"A3","name":"Alleloscope","category":"A","tagline":"Pool SNP allele counts across cells and candidate regions to estimate haplotype imbalance.","steps":[{"title":"Define regions","text":"Provide candidate genomic regions and allele counts at informative SNPs."},{"title":"Phase","text":"Estimate SNP haplotype orientation jointly across cells using an expectation-maximization procedure."},{"title":"Pool","text":"Aggregate oriented alleles within each region for more informative regional counts."},{"title":"Estimate","text":"Estimate cell-level major-haplotype proportions and combine with relative coverage to assess allele states and confidence."}],"example":{"title":"Regional imbalance","setup":"Illustratively, phased observations in one region total 18 reads on one haplotype and 6 on the other.","steps":["Orient SNP alleles consistently before pooling.","The pooled fraction is 18/24 = 0.75.","Compare this regional imbalance with relative depth and uncertainty."],"interpretation":"The signal is consistent with imbalance; it does not by itself determine an integer genotype."},"adaptation":{"stage":"alleles","available":["AT site observations and relative depth exist"],"needed":["SNP-level counts and region definitions","Verified phase and preferably matched DNA segmentation"],"first_experiment":"Audit whether SNP-level counts and phase can be reconstructed for one region.","success":"Quantify usable sites and uncertainty before attempting a regional comparison."},"cautions":["Unobserved alleles are missing evidence, not zero copies.","Phase errors or cell mixtures can distort pooled fractions.","Matched DNA segmentation is recommended for scATAC."],"sources":[{"title":"Alleloscope paper","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC9127226/"},{"title":"Alleloscope repository","url":"https://github.com/seasoncloud/Alleloscope"}],"demo":"alleles","record":{"name":"Alleloscope","assay":"scDNA and scATAC","inputs":"SNP allele counts per cell and region, depth counts, candidate regions; matched DNA segmentation recommended for scATAC","outputs":"Per-cell major haplotype proportion, relative coverage, allele states and posterior confidence","mechanism":"EM phases SNPs across cells and pools SNPs per region; relative depth and allelic proportions","reference_requirements":"Not intrinsically reliant on a designated normal; calibration and absolute states require additional assumptions; matched DNA recommended","low_coverage_handling":"Pooling increases information but phase errors, mixture and no allele reads limit inference","homozygous_deletion":"Not established: neither generic loss nor missing allele observations prove 0:0","evidence":"Published scATAC and scDNA; regional events and selected marker regions, not a universal resolution guarantee","implementation":{"code_url":"https://github.com/seasoncloud/Alleloscope","version_or_commit":"GitHub package metadata mirror reports 1.0.1; current official DESCRIPTION inaccessible; commit not pinned","license":null,"license_url":"https://github.com/seasoncloud/Alleloscope/blob/main/DESCRIPTION","compute_notes":"No execution or benchmark; runtime depends on cells and genomic resolution."},"fit":"Relevant regional allele model; current bin sums may lack SNP-level phase and matched DNA segments","limitations":["Absolute biological truth and calibration cannot be inferred from agreement.","Exact uncertainty, state limits and tested resolution need further source audit where not stated."],"source_ids":["allelo","allelocode"],"uncertain":["Official DESCRIPTION was inaccessible; third-party GitHub package mirror reports GPL-2 and version 1.0.1 but does not verify current official terms; obtain source before reuse","Exact commit, compute cost and state limits not verified"]},"originalName":"Alleloscope","kind":"Published comparator"},{"id":"A4","name":"Numbat-multiome","category":"A","tagline":"A joint probabilistic model combines reference-normalized ATAC depth and phased SNP alleles along chromosomes.","steps":[{"title":"Prepare","text":"Supply raw bin-by-cell ATAC counts, genomic bins, normalized ATAC reference and phased SNP-level allele counts."},{"title":"Model","text":"Use a Poisson-lognormal coverage model and a beta-binomial phased allele-count model to score candidate joint states."},{"title":"Connect","text":"A hidden Markov model (HMM) shares information across neighboring bins and models state transitions."},{"title":"Pool","text":"Iterative clone-aware pooling improves estimates and returns state probabilities and clones."}],"example":{"title":"Joint evidence","setup":"Imagine a region with normalized depth near 0.6 and phased counts 18 versus 6.","steps":["Compare depth against a defensible ATAC reference.","Score allele imbalance using the phased counts and their uncertainty.","Combine both signals with neighboring bins in the HMM."],"interpretation":"A loss-like state may gain support, but this hypothetical input is not a tool result or proof of absolute copy number."},"adaptation":{"stage":"reference","available":["Existing ATAC depth and site observations","Published ATAC-bin mode is a relevant comparator"],"needed":["Suitable ATAC reference","Compatible raw fragment counts, bin geometry, phased SNP-level counts and verified phase continuity"],"first_experiment":"Audit inputs and reference suitability before a small ATAC-bin feasibility run.","success":"Demonstrate input compatibility and report posterior uncertainty against independent evidence."},"cautions":["No suitable normal reference is established here; MCF10-A is not assumed diploid.","Current pyEpi pipeline uses AD segmentation, not this HMM.","Missing alleles and uncertain phase restrict power; ATAC 0:0 sensitivity is unvalidated here."],"sources":[{"title":"Numbat-multiome paper","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12531993/"},{"title":"ATAC-bin input vignette","url":"https://kharchenkolab.github.io/numbat/articles/numbat-multiome.html"}],"demo":"reference","record":{"name":"Numbat","assay":"Numbat-multiome: published scATAC alone, scRNA alone or separate same-sample modalities","inputs":"ATAC-bin: raw integer bin-by-cell fragment counts; bin-by-reference-type normalized ATAC matrix; genomic-bin GRanges; phased SNP-level allele-count table; parameter file. Official preparation uses aligned barcoded BAM, SNP VCF and Eagle2 reference panel.","outputs":"Allele-specific alteration states, posterior probabilities and clones","mechanism":"Published joint HMM models bin coverage with Poisson log-normal and phased allele counts with beta-binomial, 15 joint states; iterative clone-aware pooling.","reference_requirements":"ATAC-bin documented with normalized ATAC reference generated from normal cells; paper used healthy donor normal plasma or annotated normal cells. No suitable reference is known here; do not assume MCF10-A diploid.","low_coverage_handling":"Uses pooled SNPs and HMM; loss of informative heterozygotes and phase uncertainty restrict power. Paper removes unobserved bins before benchmark; missing-data behavior in all modes still requires code audit.","homozygous_deletion":"Explicit (0,0) candidate genotype in scRNA model; not proof that ATAC can resolve it","evidence":"Published scATAC ATAC-bin mode benchmarked against matched WGS in MM and CLL/RS tumor cohorts; average ~200 kb bins, bin sizes 50–500 kb examined; not validated here or in no-normal homogeneous samples.","implementation":{"code_url":"https://github.com/kharchenkolab/numbat","version_or_commit":"DESCRIPTION main 1.5.2, accessed 2026-10-29; exact commit not pinned","license":"MIT + file LICENSE","license_url":"https://github.com/kharchenkolab/numbat/blob/main/LICENSE","compute_notes":"Paper evaluates 2,500 cells on 8 cores / 16 GB at 50–500 kb; runtime depends on resolution. No local execution."},"fit":"Direct candidate for later ATAC-only feasibility experiment, contingent on suitable reference and SNP-level data; existing raw depth counting unit and bin geometry need reconciliation.","limitations":["Absolute biological truth and calibration cannot be inferred from agreement.","Exact uncertainty, state limits and tested resolution need further source audit where not stated."],"source_ids":["numbat","numbatdocs","numbatcode","multiome","multiomedocs","numbatdesc","numbatentry"],"uncertain":["Exact CLI mode flag and discrepancy between vignette prose and example require testing source version before execution","Current raw depth counting unit, SNP-level alleles and suitable ATAC reference not established","No-normal calibration, 0:0 sensitivity and uncertainty calibration not established"]},"originalName":"Numbat","kind":"Published comparator"},{"id":"A5","name":"CopyKAT","category":"A","tagline":"Smooth ordered gene expression to identify broad relative copy-number patterns in scRNA-seq.","steps":[{"title":"Prepare","text":"Order RNA genes genomically, apply a variance-stabilizing Freeman–Tukey transformation, and smooth outliers with a polynomial dynamic linear model."},{"title":"Reference","text":"Use clustering and Gaussian-mixture criteria to infer a putative diploid reference; this assumption can fail."},{"title":"Segment","text":"Apply Bayesian Markov chain Monte Carlo segmentation to relative expression, then merge segments using Kolmogorov–Smirnov tests."},{"title":"Classify","text":"Use the resulting broad profiles and normal-enrichment/mixture criteria to group cells and explore subclones."}],"example":{"title":"Expression pattern","setup":"Hypothetically, a sequence of genes has normalized expression near 0.7 compared with a putative reference of 1.","steps":["Order the genes and smooth local expression.","Identify a sustained change across a broad interval.","Compare the interval and cells with the inferred reference."],"interpretation":"The change is a candidate RNA-derived relative alteration; regulated expression could also contribute."},"adaptation":{"stage":"reference","available":["Relative ATAC profiles provide a development baseline"],"needed":["Compatible RNA expression matrix and gene coordinates","Defensible reference strategy"],"first_experiment":"Study reference sensitivity on a separate compatible RNA dataset before transferring any concept.","success":"Report how inferred baseline and broad calls change with reference choice."},"cautions":["RNA expression is not ATAC fragment depth; direct input substitution is invalid.","A putative diploid group is an inference, not verified normal truth.","Smoothing can obscure focal events."],"sources":[{"title":"CopyKAT paper","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC8122019/"},{"title":"CopyKAT repository","url":"https://github.com/navinlabcode/copykat"},{"title":"XClone comparison","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC11303794/"}],"demo":"reference","record":{"name":"CopyKAT","assay":"scRNA","inputs":"Gene-by-cell expression and gene positions","outputs":"Relative aneuploid/diploid labels and CNA profiles","mechanism":"Expression smoothing and segmentation; no allele counts","reference_requirements":"Infers putative diploid baseline; failure possible with no suitable reference","low_coverage_handling":"Gene smoothing addresses sparse expression but obscures fine events","homozygous_deletion":"Not established","evidence":"Published scRNA; ~5 Mb claimed resolution","implementation":{"code_url":"https://github.com/navinlabcode/copykat","version_or_commit":"Repository default branch inspected 2026-10-29; exact commit not pinned","license":null,"license_url":null,"compute_notes":"No execution or benchmark; runtime depends on cells and genomic resolution."},"fit":"No compatible gene expression matrix; baseline inference circular if unverified","limitations":["Absolute biological truth and calibration cannot be inferred from agreement.","Exact uncertainty, state limits and tested resolution need further source audit where not stated."],"source_ids":["copykat","xclone"],"uncertain":["Exact commit, resources and detailed missing-data behavior not verified","License not verified; inspect actual license before reuse"]},"originalName":"CopyKAT","kind":"Cross-assay transfer"},{"id":"A6","name":"inferCNV","category":"A","tagline":"Compare genomically smoothed RNA expression in cells with a chosen reference.","steps":[{"title":"Order","text":"Provide gene expression, gene order and cell annotations."},{"title":"Reference","text":"Estimate expected expression from selected reference cells or a defined alternative."},{"title":"Smooth","text":"Denoise expression and smooth along ordered genes to reveal broad patterns."},{"title":"Infer","text":"Optionally apply an HMM: i3 models loss, neutral and gain; i6 estimates six state emissions using simulated expression spike-ins based on reference cells."}],"example":{"title":"Reference comparison","setup":"Suppose five neighboring genes average 0.8 relative to selected reference cells.","steps":["Normalize each cell and compare gene expression to the reference.","Smooth across nearby genes.","Inspect the broad deviation and optionally infer HMM states."],"interpretation":"A persistent decrease is a candidate RNA signal, not evidence of an absolute deletion."},"adaptation":{"stage":"reference","available":["ATAC bins and relative pyEpi calls"],"needed":["Gene expression and gene positions","Reference annotations with explicit assumptions"],"first_experiment":"Test how changing a reference affects a compatible RNA example; document what transfers conceptually.","success":"Show reference sensitivity separately from independent validation."},"cautions":["ATAC accessibility and RNA expression have different biases; do not run directly on ATAC bins.","A cell cluster is not automatically a normal reference.","Smoothing cannot turn absent evidence into a measured region."],"sources":[{"title":"inferCNV repository","url":"https://github.com/broadinstitute/infercnv"},{"title":"inferCNV HMM methods","url":"https://github.com/broadinstitute/infercnv/wiki/inferCNV-HMM-based-CNV-Prediction-Methods/b16dd85440225a190a16e19fdc643fd8f9787a14"}],"demo":"reference","record":{"name":"inferCNV","assay":"scRNA","inputs":"Gene expression, genomic gene order and reference annotations","outputs":"Relative smoothed expression CNA estimates; optional HMM states","mechanism":"Genomic smoothing and denoising of gene expression","reference_requirements":"Requires reference strategy; no validated diploid anchor here","low_coverage_handling":"Smoothing sparse genes does not establish missing regions","homozygous_deletion":"Not established","evidence":"scRNA method; untested transfer to ATAC bins","implementation":{"code_url":"https://github.com/broadinstitute/infercnv","version_or_co Use the multiscale idea to inspect stability across ATAC resolutions without substituting the RNA model.","success":"Record which candidates persist across scales and where allele evidence is missing."},"cautions":["CaSpER is an RNA method; transferring its emissions to ATAC needs separate validation.","Allelic expression bias can mimic imbalance.","A low signal is not proof of a homozygous deletion.","The RNA HMM includes a homozygous-deletion state, but its existence does not establish detection in this ATAC workflow."],"sources":[{"title":"CaSpER paper","url":"https://doi.org/10.1038/s41467-019-13779-x"}],"demo":"alleles","record":{"name":"CaSpER","assay":"scRNA and bulk RNA","inputs":"Expression plus allele reads and gene coordinates","outputs":"Expression/allelic CNA and LOH estimates","mechanism":"Multiscale expression and BAF smoothing","reference_requirements":"Reference and baseline details require dedicated review","low_coverage_handling":"Sparse RNA alleles and smoothing limit resolution","homozygous_deletion":"Not established","evidence":"Published RNA; ATAC transfer untested","implementation":{"code_url":"https://github.com/akdess/CaSpER","version_or_commit":"Repository default branch inspected 2026-10-29; exact commit not pinned","license":null,"license_url":null,"compute_notes":"No execution or benchmark; runtime depends on cells and genomic resolution."},"fit":"Expression model and inputs unavailable","limitations":["Absolute biological truth and calibration cannot be inferred from agreement.","Exact uncertainty, state limits and tested resolution need further source audit where not stated."],"source_ids":["casper","xclone"],"uncertain":["Exact commit, resources and detailed missing-data behavior not verified","License not verified; inspect actual license before reuse"]},"originalName":"CaSpER","kind":"Cross-assay transfer"},{"id":"A8","name":"HoneyBADGER","category":"A","tagline":"Use probabilistic genomic models of RNA expression and allele observations to infer candidate CNV and LOH.","steps":[{"title":"Cluster","text":"Cluster cells using smoothed lesser-allele fractions, split into groups and pool their observations."},{"title":"Find regions","text":"Apply an HMM to pooled lesser-allele fractions to identify candidate CNV or LOH regions."},{"title":"Score cells","text":"Use a Bayesian hierarchical model to estimate per-cell posterior probabilities for each candidate region, incorporating expression and alleles."},{"title":"Recurse","text":"Cluster cells by posterior probabilities, split into putative subclones, and repeat until no further subclones are found."}],"example":{"title":"Sparse RNA alleles","setup":"Imagine a region with reduced expression and 18 versus 6 allele reads across informative SNPs.","steps":["Order expression and allele evidence along the genome.","Model persistence of candidate states across nearby observations.","Inspect posterior support and region-level evidence."],"interpretation":"A region may support a candidate alteration, while RNA-specific biases and uncertain baselines remain plausible."},"adaptation":{"stage":"alleles","available":["Relative ATAC depth","AT site observations"],"needed":["RNA expression and allele matrices for the actual method","A separately justified ATAC observation model for any adaptation"],"first_experiment":"Prototype separate depth and allele evidence displays, including missingness, before proposing any joint model.","success":"Retain calibrated uncertainty and distinguish absence of observations from evidence of balance."},"cautions":["RNA-based emissions cannot simply be applied to ATAC.","Pooling can mask heterogeneous cells.","Missing-data behavior requires further source audit."],"sources":[{"title":"HoneyBADGER paper","url":"https://genome.cshlp.org/highwire/markup/item_fulltext/1052075"},{"title":"HoneyBADGER code","url":"https://github.com/JEFworks-Lab/HoneyBADGER"}],"demo":"alleles","record":{"name":"HoneyBADGER","assay":"scRNA","inputs":"Expression and allele measurements with genomic coordinates","outputs":"CNV and LOH posterior estimates","mechanism":"Bayesian HMM integrates expression and allelic information","reference_requirements":"Baseline assumptions require further inspection","low_coverage_handling":"Pools sparse data; detailed missing-data treatment unresolved","homozygous_deletion":"Not established","evidence":"Published scRNA; ATAC transfer untested","implementation":{"code_url":"https://github.com/JEFworks-Lab/HoneyBADGER","version_or_commit":"Repository default branch inspected 2026-10-29; exact commit not pinned","license":"GPL-3.0","license_url":"https://github.com/JEFworks-Lab/HoneyBADGER/blob/master/LICENSE","compute_notes":"No execution or benchmark; runtime depends on cells and genomic resolution."},"fit":"Potential HMM concept only","limitations":["Absolute biological truth and calibration cannot be inferred from agreement.","Exact uncertainty, state limits and tested resolution need further source audit where not stated."],"source_ids":["honey"],"uncertain":["Exact commit, resources and detailed missing-data behavior not verified"]},"originalName":"HoneyBADGER","kind":"Cross-assay transfer"},{"id":"A9","name":"XClone","category":"A","tagline":"Model RNA read-depth and phased allelic signals separately, then combine their state evidence.","steps":[{"title":"Prepare","text":"Build gene-by-cell expression and allele count matrices and select reference cells."},{"title":"Phase","text":"Orient allele counts through local and broader phasing steps."},{"title":"Model","text":"Fit separate expression and allele mixture models; the phased allele module uses a beta-binomial likelihood. Smooth state probabilities along the genome using an HMM and across related cells."},{"title":"Combine","text":"Combine module outputs to obtain candidate allele-specific copy-number state probabilities."}],"example":{"title":"Complementary evidence","setup":"A hypothetical region has expression ratio 0.7 and phased RNA counts 18 versus 6.","steps":["The expression module scores the lower ratio.","The allele module evaluates imbalance and its uncertainty.","Combine the module evidence while retaining each separate result."],"interpretation":"Concordance strengthens a candidate relative alteration but does not independently validate an integer state."},"adaptation":{"stage":"alleles","available":["ATAC depth and observed alleles"],"needed":["RNA expression and allele inputs for XClone","Verified phase continuity and a defensible reference"],"first_experiment":"Visualize ATAC depth and allelic evidence side by side with explicit missing-data masks.","success":"Find cases of concordance and disagreement without treating either signal as ground truth."},"cautions":["XClone is designed for RNA, so its noise model requires validation before any ATAC adaptation.","Neighbor smoothing can mix biologically distinct cells.","No observed alleles cannot be treated as balanced."],"sources":[{"title":"XClone paper","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC11303794/"},{"title":"XClone documentation","url":"https://xclone-cnv.readthedocs.io/en/latest/"}],"demo":"alleles","record":{"name":"XClone","assay":"scRNA","inputs":"Gene counts and allele-specific read counts, reference annotations","outputs":"Posterior CNA states combining RDR and BAF","mechanism":"Separate RDR/BAF models and phasing, then combines results","reference_requirements":"Reference expression required; baseline assumptions constrain inference","low_coverage_handling":"Models sparse RNA, local/global phasing and smoothing","homozygous_deletion":"Exact 0:0 detection capability not verified","evidence":"Published scRNA; ATAC transfer untested","implementation":{"code_url":"https://github.com/single-cell-genetics/XClone","version_or_commit":"Repository default branch inspected 2026-10-29; exact commit not pinned","license":null,"license_url":null,"compute_notes":"No execution or benchmark; runtime depends on cel ency and uncertainty on independent controls or simulations."},"cautions":["DNA read-depth emissions do not automatically transfer to accessibility.","Default mode uses a matched normal; no-normal mode still has assumptions.","Relative category 0 cannot supply absolute zero-copy input."],"sources":[{"title":"CHISEL paper","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC9876616/"},{"title":"CHISEL repository","url":"https://github.com/raphael-group/chisel"}],"demo":"alleles","record":{"name":"CHISEL","assay":"scDNA","inputs":"Barcoded DNA BAM, phased germline SNPs, matched normal in default mode","outputs":"Integer allele/haplotype states, ploidy and clones","mechanism":"Cross-cell SNP block phasing and joint RDR/BAF clustering","reference_requirements":"Default matched normal; no-normal variant available; integer ploidy remains assumption-sensitive","low_coverage_handling":"Uses across-cell aggregation; paper used 5 Mb bins at \u003c0.05x","homozygous_deletion":"Integer model allows nonnegative allele copies; specific detection/calibration of 0:0 not verified","evidence":"Published low-coverage scDNA, not established for ATAC","implementation":{"code_url":"https://github.com/raphael-group/chisel","version_or_commit":"Repository default branch inspected 2026-10-29; exact commit not pinned","license":"BSD-3-Clause","license_url":"https://github.com/raphael-group/chisel/blob/master/LICENSE","compute_notes":"No execution or benchmark; runtime depends on cells and genomic resolution."},"fit":"Phasing strategy only; DNA depth emission and BAM incompatible with ATAC assumptions","limitations":["Absolute biological truth and calibration cannot be inferred from agreement.","Exact uncertainty, state limits and tested resolution need further source audit where not stated."],"source_ids":["chisel","chiselcode"],"uncertain":["Exact commit, resources and detailed missing-data behavior not verified"]},"originalName":"CHISEL","kind":"Cross-assay transfer"},{"id":"A11","name":"signals","category":"A","tagline":"Phase alleles across low-coverage DNA cells, then infer haplotype states with an HMM.","steps":[{"title":"Prepare","text":"Provide total integer DNA copy-number bins and per-cell haplotype-block allele counts."},{"title":"Phase","text":"Use patterns of gains and losses across cells to orient alleles."},{"title":"Model","text":"Use an HMM to infer allele-specific states along the genome given total copy number."},{"title":"Report","text":"Return haplotype-specific states and LOH-related labels for each cell and bin."}],"example":{"title":"Conditioning on total copy number","setup":"Suppose a DNA bin has independently inferred total CN 2 and phased counts 18 versus 6.","steps":["Provide the integer total CN and oriented block counts.","Compare candidate haplotype states under the allele model.","Use neighboring bins to inform the HMM state."],"interpretation":"An imbalanced candidate can be assessed only conditional on the supplied CN and phase; the counts alone do not fix a genotype."},"adaptation":{"stage":"alleles","available":["ATAC site observations and relative categories"],"needed":["Independently justified integer total CN","Compatible haplotype block counts and validated phase"],"first_experiment":"Check whether any independent DNA-derived total CN is available before considering this comparator.","success":"Explicitly document input provenance and assess uncertainty from upstream CN and phase."},"cautions":["The existing loss/base/gain categories are not integer total copy number.","A-Hom or B-Hom indicates one allele lost, not necessarily both.","This DNA method is not validated for the current ATAC data."],"sources":[{"title":"signals documentation","url":"https://shahcompbio.github.io/signals/"}],"demo":"alleles","record":{"name":"signals (Single Cell Genomes with Allele Specificity)","assay":"scDNA DLP+","inputs":"Total integer CN bins and per-cell haplotype block counts","outputs":"Allele/haplotype-specific states, BAF and e phased alleles","text":"A beta-binomial emission models phased haplotype counts conditional on total allele observations. It allows more variability than a fixed-fraction binomial; sparse allele counts give weak evidence."},{"title":"Combine across neighbors","text":"The HMM combines emission scores with transitions that favor state persistence while allowing changes. Inference sums probability over possible neighboring state paths to estimate state uncertainty; this is model-based integration, not independent confirmation of depth by alleles."},{"title":"Interpret relative to reference","text":"Compare inferred events and uncertainty with the reference and independent validation; audit the exact implementation treatment of gaps and missing observations."}],"example":{"title":"Depth and alleles together","setup":"Illustrative bins have relative depths 1.0, 1.1, 0.5, 0.5; covered SNPs in the last region favor one phased haplotype.","steps":["Compare emissions for a persistent baseline with a change after bin 2.","Combine Poisson-lognormal depth and beta-binomial allele emission scores with transitions across neighboring bins; sum over possible state paths when calculating state probabilities.","Report a candidate boundary and uncertainty relative to the reference."],"interpretation":"These numbers illustrate reasoning, not a Numbat fit or proof of an absolute deletion."},"adaptation":{"stage":"inputs","available":["Raw bin counts","HA, HB and AT matrices"],"needed":["SNP-level counts and phase sets","Defensible reference and exact count provenance","Audited gap handling"],"first_experiment":"Audit barcode joins, phase and reference eligibility before any comparator run.","success":"A reproducible prerequisite report and, if feasible, comparison against independent truth."},"cautions":["MCF10-A is a development dataset; its identity does not establish normal or diploid truth.","AT is summed SNP-site depth and may count one molecule at multiple sites; do not assume it is independent of bin depth.","Missing allele observations are not balanced observations; exact implementation behavior needs audit.","Depth and allele signals can share fragments, so their agreement is not automatically independent confirmation; audit the published model assumptions for this assay."],"sources":[{"title":"Numbat-multiome","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12531993/"},{"title":"Haplotype-aware analysis of somatic copy number variations","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10289836/"}],"demo":"alleles","record":{"name":"Numbat-multiome ATAC-bin","assay":"Published scATAC tumor cohorts, WGS comparisons","inputs":"Raw fragment bin counts; SNP-level phased allele counts; bins; normalized reference per cell type","outputs":"HMM event states, clone and cell probabilities relative to reference","mechanism":"Haplotype-aware depth/allele HMM with binned accessibility","reference_requirements":"Reference count profiles; evaluated with annotated normal cells","low_coverage_handling":"Sparse allele data limit inference; exact missing-site/gap behavior needs source-level audit","homozygous_deletion":"No local validation; do not interpret categorical loss as absolute zero","evidence":"Published scATAC; current sample compatibility untested","implementation":{"code_url":"https://github.com/kharchenkolab/numbat","version_or_commit":"1.5.2 declared on main, accessed 2026-10-29; commit not pinned","license":"MIT + file LICENSE (package DESCRIPTION)","license_url":"https://github.com/kharchenkolab/numbat/blob/main/LICENSE","compute_notes":"No local runtime measured; paper used 2500 cells, 8 cores, 16 GB for bin-size evaluation; smaller bins increased runtime."},"fit":"Most relevant published comparator if SNP-level phase and defensible reference recovered","limitations":["Missing phase sets and normalized reference; depth and SNP counts overlap; baseline ambiguity","Posterior calibration and dependence under this assay unresolved","Event-level arm/focal benchmark excluded segments \u003c10% of an arm or \u003c200 kb; separate bin-size analysis was visual in one complex sample."],"source_ids":["multi","vignette","numbat","repo","shared","numbat_description","numbat_license"],"uncertain":["Gap/missing-emission and dependence treatment not verified","Exact commit and no-reference mode not verified"]},"originalName":"Numbat-multiome ATAC-bin","kind":"Published comparator"},{"id":"B2","name":"Masked count changepoint with conditional alleles","category":"B","tagline":"Proposed depth-first segmentation, with alleles only when the joint measurement is justified.","steps":[{"title":"Keep the genomic grid","text":"Retain coordinates, observed zero counts, callable spans, exposure and explicit gaps; a missing measurement is not zero."},{"title":"Specify a segment cost","text":"Choose a count likelihood, such as an exposure-adjusted Poisson or negative binomial, and calculate negative log likelihood within each candidate segment."},{"title":"Optimize boundaries","text":"PELT minimizes the sum of segment costs plus a penalty per changepoint; it is an optimization algorithm, not a particular likelihood."},{"title":"Quantify uncertainty","text":"Vary penalty and assumptions, and assess boundary stability with a suitable resampling or independent dataset."},{"title":"Add conditional alleles","text":"Only after auditing shared molecules and phase, test an explicitly derived conditional allele model; otherwise report depth and allele evidence separately."}],"example":{"title":"A boundary on a count grid","setup":"Four equally exposed bins contain 10, 12, 4, 3 counts.","steps":["A one-segment Poisson model uses mean 7.25.","A two-segment model after bin 2 uses means 11 and 3.5 and fits the counts better.","Keep the split only if the likelihood improvement exceeds the chosen changepoint penalty."],"interpretation":"A retained boundary is a relative count change; accessibility or technical bias can also cause it."},"adaptation":{"stage":"segment","available":["Raw depth and bin coordinates","Observed allele matrices"],"needed":["Exposure and callable-mask audit","Penalty calibration","Independent validation and conditional measurement model"],"first_experiment":"Freeze a grid and compare depth-only boundaries across penalties and held-out cells.","success":"Stable boundaries and calibrated uncertainty across independent datasets, with explicit abstention where coverage is weak."},"cautions":["This is a proposed diagnostic, not existing pyEpiAneufinder statistical behavior.","Selecting boundaries and testing them on the same data can bias significance.","A categorical loss or depth zero does not establish absolute zero copies."],"sources":[{"title":"Optimal Detection of Changepoints With a Linear Computational Cost","url":"https://doi.org/10.1080/01621459.2012.737745"},{"title":"BIC-seq2","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC5772337/"}],"demo":"depth","record":{"name":"Masked count changepoint with conditional alleles (proposed)","assay":"Untested transfer from count segmentation to scATAC","inputs":"Raw counts and exposure/covariates; retained bin coordinates; SNP-level counts and phase blocks if available","outputs":"Relative depth segments, boundary intervals; allele evidence or insufficient evidence","mechanism":"Count likelihood or heteroscedastic model for depth; conditional allele model only after dependence/phase assumptions tested; count zero retained; missing emission omitted","reference_requirements":"No normal required for relative boundaries; absolute loss needs anchor","low_coverage_handling":"Depth can yield a boundary without allele coverage; genomic gaps represented explicitly; no fabricated balance","homozygous_deletion":"Unsupported as definitive state without anchor and orthogonal evidence","evidence":"PELT/BIC-seq2 support changepoint ideas in other contexts, not this design","implementation":{"code_url":null,"version_or_commit":null,"license":null,"license_url":null,"compute_notes":"Not measured; no installation or runtime conducted."},"fit":"Feasible depth-only diagnostic on frozen grid; joint extension blocked by phase and dependence","limitations":["Accessibility and dosage confounded; adaptive boundary selection biases downstream significance","Conditional factorization must be derived from actual molecule counting; AT is SNP DP and not unique fragment count"],"source_ids":["bic","pelt","shared"],"uncertain":["Likelihood, covariance and calibration require empirical validation"]},"originalName":"Masked count changepoint with conditional alleles (proposed)","kind":"Proposed diagnostic"},{"id":"B3","name":"Covariance-aware joint segmentation / Bayesian HMM","category":"B","tagline":"Proposed joint model that explicitly represents dependence and missing evidence.","steps":[{"title":"Describe observations","text":"Define depth and SNP-site allele counts, exposure, phase blocks and whether measurements share fragments."},{"title":"Write a joint emission","text":"Use a justified shared-fragment generative model or an empirically supported covariance model; do not simply multiply dependent likelihoods."},{"title":"Handle partial observations","text":"Marginalize an unavailable component under an explicit missingness assumption; an observed count of zero remains an observation."},{"title":"Model state continuity","text":"Assign genomic-distance-aware transition probabilities between candidate states and allow phase-block orientation uncertainty."},{"title":"Infer and check","text":"Combine emissions and transitions to obtain boundary or state uncertainty, then check calibration and abstain where the model is uninformative."}],"example":{"title":"One missing allele bin","setup":"Three bins have relative depth 1.0, 0.5, 0.5; the last has no callable allele observations.","steps":["Use depth evidence in all three bins and allele evidence only where measured.","A state transition after bin 1 competes with the prior favoring continuity.","The last bin contributes no invented balanced allele count; the transition and neighboring data still influence its posterior."],"interpretation":"Missingness can itself be informative, so marginalization is valid only under justified assumptions."},"adaptation":{"stage":"segment","available":["Raw depth","HA, HB and AT","Coordinates"],"needed":["SNP phase blocks and molecule-level counting","Dependence and missingness model","Calibrated transition policy"],"first_experiment":"Measure shared fragments and phase orientation before constructing simulated joint data.","success":"Held-out boundary coverage and false positives remain calibrated under sparse and correlated observations."},"cautions":["The model is proposed and unvalidated; its covariance can be difficult to estimate at low coverage.","A posterior reflects the chosen priors and likelihood, not independent biological validation.","AT site counts can duplicate molecules; phase orientation is not established."],"sources":[{"title":"Haplotype-aware analysis of somatic copy number variations","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10289836/"},{"title":"FACETS allele-specific copy number","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC5027494/"}],"demo":"alleles","record":{"name":"Covariance-aware joint segmentation / Bayesian HMM (proposed)","assay":"Untested scATAC adaptation of multivariate segmentation","inputs":"Depth and allele observations with covariance or explicit shared-fragment generative model; phase sets; coordinates","outputs":"Boundary posterior or intervals; relative depth and allele-state uncertainty; abstention","mechanism":"Joint likelihood with missing components marginalized; distance-aware transitions; phase-block-specific nuisance orientation","reference_requirements":"Relative segmentation possible without normal; absolute states need identifiable anchor","low_coverage_handling":"Unobserved allele emission contributes no evidence; calibrated conditional depen compare independent evidence; neither method is automatically transferable from bulk DNA to sparse ATAC."}],"example":{"title":"Same depth, different allele balance","setup":"Two hypothetical regions have equal normalized total depth; one has balanced alleles and the other has a persistent imbalance.","steps":["Joint segmentation can consider an allele shift even without a depth shift.","A purity/ploidy solution proposes allele-specific states compatible with both signals.","Another purity or baseline may also fit; assess alternative solutions."],"interpretation":"Imbalance is informative but does not uniquely determine absolute copy number without identifiable assumptions."},"adaptation":{"stage":"reference","available":["Relative depth and allele matrices"],"needed":["Matched normal or other defensible bias controls","Assay-compatible signals","Validated purity/ploidy assumptions"],"first_experiment":"Use these methods as conceptual comparators on external paired-DNA benchmark data before considering adaptation.","success":"Reproduce benchmark behavior and make solution ambiguity visible."},"cautions":["Published DNA and array methods are not drop-in scATAC callers.","No matched normal or diploid anchor is assumed locally.","Depth and alleles can share fragments, and accessibility can confound dosage."],"sources":[{"title":"FACETS allele-specific copy number","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC5027494/"},{"title":"Allele-specific copy number analysis of tumors","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC2947907/"}],"demo":"reference","record":{"name":"FACETS joint CBS and ASCAT/ASPCF","assay":"Bulk paired tumor-normal DNA sequencing; SNP arrays","inputs":"Matched normal and tumor SNP depth/allele signals; ASCAT baseline and ploidy assumptions","outputs":"Joint boundaries and allele-specific CN; purity/ploidy","mechanism":"FACETS multivariate rank-based CBS and matched normal log odds; ASCAT models admixture/ploidy","reference_requirements":"FACET y imputation and retain the original observed data and missingness mask."}],"example":{"title":"A masked middle bin","setup":"Three adjacent observed counts are 8, 0, 10.","steps":["Hide the middle value from the predictor.","A simple neighbor-based predictor might return 9.","Compare that prediction with the held-out measured zero when evaluating prediction error."],"interpretation":"The predicted 9 is not an observed count; a genuine boundary or correlated noise can make smoothing misleading."},"adaptation":{"stage":"interpret","available":["Binned observations and masks"],"needed":["A defensible noise-independence assumption","Held-out controls and boundary-preservation tests"],"first_experiment":"Test denoising only on controlled synthetic data with known boundaries and realistic correlations.","success":"Predictions preserve boundaries and uncertainty in independent tests; raw evidence remains available."},"cautions":["Noise2Self was not established as a CN segmentation method for this assay.","Imputation can blur boundaries or invent apparent allele evidence.","Do not fill missing alleles and then treat predictions as measurements."],"sources":[{"title":"Noise2Self: Blind Denoising by Self-Supervision","url":"https://arxiv.org/abs/1901.11365"}],"demo":"none","record":{"name":"Blind-spot image denoising / Noise2Self","assay":"Images and single-cell expression examples","inputs":"Noisy data and assumed suitable independent noise","outputs":"Denoised predictions, not independent CN evidence","mechanism":"Mask observations and predict from other features","reference_requirements":"No CN baseline provided","low_coverage_handling":"Masked predictions are imputation, not observed alleles","homozygous_deletion":"Not applicable","evidence":"Published outside genomic CN segmentation; transfer untested","implementation":{"code_url":null,"version_or_commit":null,"license":null,"license_url":null,"compute_notes":"Not measured; no installation or runtime conducted."},"fit":"Do not use for evidence or fill allele gaps","limitations":["Spatially correlated accessibility, phase and count noise violate straightforward transfer","Can blur boundaries and hallucinate signal"],"source_ids":["noise"],"uncertain":["No study of this task identified"]},"originalName":"Blind-spot image denoising / Noise2Self","kind":"Denoising concept"},{"id":"C1","name":"Independent internal normal controls","category":"C","tagline":"Optional for future mixed samples; none identified in current homogeneous cell line","steps":[{"title":"Select controls before comparing","text":"Select independently supported cells with compatible assay, build and regional DNA evidence. A lineage label alone does not establish copy neutrality."},{"title":"Build the reference","text":"Aggregate their 100 kb bin counts with a documented library-size normalization, checking callable coverage and variation between donors."},{"title":"Compare and stress-test","text":"Compare query counts with the reference and leave donors or cell groups out; uncertainty grows where reference coverage is poor."}],"example":{"title":"Toy matched-control comparison","setup":"Suppose 20 independently characterized control cells and 30 query cells have counts in the same bin grid.","steps":["Normalize each cell for exposure; aggregate the 20 controls.","A query bin is 0.7 relative to the reference; repeat excluding one donor."],"interpretation":"A stable relative decrease is consistent with a difference, not an absolute copy state."},"adaptation":{"stage":"reference","available":["100 kb retained bins","development depth data"],"needed":["independently characterized controls","matched count units and build","donor metadata"],"first_experiment":"Audit control identity and compare donor-held-out reference profiles.","success":"Reference profiles remain stable within prespecified uncertainty across held-out controls."},"cautions":["Independent provenance is needed; shared germline changes and accessibility dif  audit, and copy neutrality is unproven.","steps":[{"title":"Choose a compatible atlas","text":"Published Numbat-multiome ATAC-bin workflows use normal-cell reference counts and phased SNP-level observations."},{"title":"Rebuild compatible bins","text":"Re-bin genuine scATAC fragments using matching coordinates and counting rules, then normalize reference by cell type; check donors and assay chemistry."},{"title":"Combine evidence","text":"The published model combines reference-relative counts and phased allele observations. Check coverage and phase provenance before any comparison."}],"example":{"title":"Toy external reference","setup":"A query and two external donors have matched 100 kb bins and genuine fragment counts.","steps":["Normalize within donor and make a bin-by-cell-type reference.","Compare query relative depth; repeat while leaving each donor out."],"interpretation":"A changing contrast signals reference mismatch; allele-site observations remain a separate, dependent evidence stream."},"adaptation":{"stage":"reference","available":["retained bin coordinates","candidate published atlas"],"needed":["matched raw integer counts","independently characterized controls","phased SNP-level data"],"first_experiment":"Audit atlas fragments, build, donor labels and count compatibility.","success":"Held-out donor differences meet prespecified mismatch tolerances."},"cautions":["Protocol, cell type, batch, assembly, coverage and control CN mismatch confound reference; source data may require access and license checks.","This is exploratory; no normal population or absolute CN anchor is assumed."],"sources":[{"title":"Numbat-multiome","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12531993/"},{"title":"Preparing Inputs for Numbat-multiome","url":"https://kharchenkolab.github.io/numbat/articles/numbat-multiome.html"}],"demo":"reference","record":{"homozygous_deletion":"Not established by reference choice; zero observations are not a 0:0 call.","low_coverage_handling" rnative robust regional baselines before looking at candidate calls."},{"title":"Normalize depth","text":"Account for cell exposure and compare retained callable bins while recording how each baseline is defined."},{"title":"Measure sensitivity","text":"Repeat after excluding candidate regions and across coverage strata. A shared broad event can be absorbed by every self-baseline."}],"example":{"title":"Toy self-centering","setup":"A cell has normalized values 8, 9, 10 and 13 in four callable bins.","steps":["Center by the mean 10, yielding relative values 0.8, 0.9, 1.0 and 1.3.","Repeat with a prespecified alternate baseline and report changes."],"interpretation":"These are relative contrasts; the center has no established diploid meaning."},"adaptation":{"stage":"reference","available":["retained depth grid","existing relative profiles"],"needed":["raw count provenance","prespecified alternate baselines"],"first_experiment":"Compare existing centering with a frozen robust alternative.","success":"Report sensitivity and abstain where direction changes or coverage is insufficient."},"cautions":["Shared broad events are absorbed into baseline; whole-genome ploidy unidentifiable; baseline changes can reverse calls.","This is exploratory; no normal population or absolute CN anchor is assumed."],"sources":[{"title":"epiAneufinder","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10511508/"}],"demo":"reference","record":{"homozygous_deletion":"Not established by reference choice; zero observations are not a 0:0 call.","low_coverage_handling":"Assess coverage and callable bins; missing allele observations are unresolved, not balanced.","uncertain":[],"name":"Reference-free relative baseline sensitivity","assay":"scATAC; homogeneous or mixed samples","inputs":"Raw bin counts, exposure, callable regions, GC/mappability; multiple prespecified baselines","outputs":"Relative depth contrast and sensitivity; unanchored or abstention","mechanism":"Compare genome-wide centering, ro y","url":"https://github.com/navinlabcode/copykat"}],"demo":"reference","record":{"homozygous_deletion":"Not established by reference choice; zero observations are not a 0:0 call.","low_coverage_handling":"Assess coverage and callable bins; missing allele observations are unresolved, not balanced.","uncertain":[],"name":"CN-selected controls: CopyscAT / CopyKAT / inferCNV","assay":"CopyscAT scATAC; CopyKAT and inferCNV scRNA","inputs":"Candidate cells or count matrix and method-specific processing","outputs":"Inferred or supplied normal/diploid reference and relative profiles","mechanism":"Method-specific normal selection or user reference followed by centering","reference_requirements":"Selection from same CN signal is circular for validating that signal; not independent normal evidence","evidence":"Published scATAC CopyscAT; RNA methods are ideas only","implementation":{"code_url":null,"version_or_commit":null,"license":null,"license_url":null,"compute_notes":"No implementation recommended; design requires calibration."},"fit":"Comparator or sensitivity analysis, not validation of normal status","limitations":["Shared alterations can be absorbed; homogeneous altered populations lack identifiable normal group; RNA methods are not ATAC callers."],"source_ids":["copyscat","copykat","infercnv"]},"originalName":"CN-selected controls: CopyscAT / CopyKAT / inferCNV","kind":"Reference strategy"},{"id":"C6","name":"DNA panel of normals as technical analogy","category":"C","tagline":"Consider only assay-matched independently characterized scATAC panel","steps":[{"title":"Learn recurring artifacts","text":"DNA panels aggregate compatible control samples to characterize recurrent technical variation across genomic bins."},{"title":"Denoise relative counts","text":"A DNA workflow uses the panel to reduce shared technical patterns before relative CN interpretation."},{"title":"Assess transfer","text":"An scATAC analogue would require matched assay and cell-state controls; DNA panels cannot directly represent chromatin accessibility."}],"example":{"title":"Toy panel analogy","setup":"Suppose five matched scATAC controls show a recurring technical spike in one 100 kb bin.","steps":["Record the spike and compare a sixth held-out control.","Check whether a proposed panel adjustment suppresses it without erasing DNA-supported events."],"interpretation":"This is a proposed scATAC adaptation, not an established panel or copy-neutral anchor."},"adaptation":{"stage":"reference","available":["100 kb grid"],"needed":["assay-matched independent controls","orthogonal DNA comparisons"],"first_experiment":"Assess reproducibility of bin-level artifacts in held-out controls.","success":"Technical effects generalize while prespecified DNA-supported contrasts remain detectable."},"cautions":["A DNA panel ignores cell-type chromatin accessibility; panel artifacts and donor CNVs can bias calls.","This is exploratory; no normal population or absolute CN anchor is assumed."],"sources":[{"title":"GATK CNV workflow","url":"https://docs.gdc.cancer.gov/Data/Bioinformatics_Pipelines/DNA_Seq_WGS/"}],"demo":"reference","record":{"homozygous_deletion":"Not established by reference choice; zero observations are not a 0:0 call.","low_coverage_handling":"Assess coverage and callable bins; missing allele observations are unresolved, not balanced.","uncertain":[],"name":"DNA panel of normals as technical analogy","assay":"Bulk DNA sequencing, not validated here for scATAC","inputs":"Compatible control counts, same assay and preprocessing","outputs":"Denoised relative copy ratios","mechanism":"Panel learns recurrent technical variation","reference_requirements":"Control panel must represent technical biases; DNA panels do not directly transfer to accessibility","evidence":"Published/official DNA workflow; proposed scATAC transfer untested","implementation":{"code_url":null,"version_or_commit":null,"license":null,"license_url":null,"compute_notes":"No implementation recommended; design requires calibration."},"fit":"Consider only assay-matched independently characterized scATAC panel","limitations":["A DNA panel ignores cell-type chromatin accessibility; panel artifacts and donor CNVs can bias calls."],"source_ids":["pon"]},"originalName":"DNA panel of normals as technical analogy","kind":"Reference strategy"},{"id":"D1","name":"Atacformer","category":"D","tagline":"Conditional zero-shot comparison once genuine peaks/fragments and confirmed assembly exist. 100 kb count bins do not encode appropriate accessible intervals.","steps":[{"title":"Tokenize accessible intervals","text":"Atacformer overlaps each cell’s accessible intervals with its fixed hg38 vocabulary, producing a set of region tokens; 100 kb count bins are not peaks."},{"title":"Learn context","text":"Region embeddings pass through transformer blocks with multi-head attention. Pretraining identifies randomly replaced tokens using their context."},{"title":"Pool representations","text":"Contextual region embeddings can be pooled into a cell embedding for exploratory comparisons; token presence need not preserve dosage."}],"example":{"title":"Toy interval mapping","setup":"A cell has three real accessible intervals and a verified hg38 vocabulary.","steps":["Overlap intervals with vocabulary regions and encode matched tokens.","Pool contextual embeddings, then compare them with a simple peak-based embedding."],"interpretation":"Nearby points indicate a learned accessibility resemblance, not a CN state."},"adaptation":{"stage":"inputs","available":["100 kb count bins"],"needed":["authentic peaks or fragments","confirmed build","checkpoint terms","held-out DNA truth"],"first_experiment":"Check vocabulary overlap and compare embeddings on independent benchmark samples.","success":"Prespecified event discrimination improves without depth or sample confounding."},"cautions":["Token presence and pooling may discard count dosage; coverage/sequence distribution shift may drive embedding ility are confounded with dosage; imputed values cannot validate unobserved CN."],"source_ids":["scbpaper","scbcode"]},"originalName":"scBasset","kind":"Representation model"},{"id":"E1","name":"Poisson / negative binomial exposure regression","category":"E","tagline":"Proposed relative count modeling starts by asking how many zeros sampling predicts.","steps":[{"title":"Define counts and exposure","text":"Use raw regional counts, callable span, per-cell exposure and carefully selected covariates."},{"title":"Fit a mean model","text":"Relate log expected count to log exposure plus region and covariate effects; interpret coefficients as relative rates."},{"title":"Compare distributions","text":"A Poisson model has variance μ; NB2 permits variance μ + μ²/r, accommodating extra variability for finite r."},{"title":"Predict zeros","text":"Poisson predicts P(0)=exp(−μ); NB2 predicts P(0)=(r/(r+μ))^r. Compare predictions with held-out observations."},{"title":"Report uncertainty","text":"Assess rate contrasts and model fit without treating the reference or a cluster as automatically diploid."}],"example":{"title":"A low mean produces zeros","setup":"For illustration take μ=0.5 counts per cell and NB2 dispersion parameter r=1.","steps":["Poisson predicts exp(−0.5) ≈ 0.607 zeros.","NB2 predicts (1/1.5)^1 ≈ 0.667 zeros.","Compare these baseline predictions with held-out zeros rather than treating every zero as a deletion."],"interpretation":"These numbers are illustrations, not fitted parameters or evidence of a biological state."},"adaptation":{"stage":"inputs","available":["Raw regional count layer","Cell barcodes and genomic bins"],"needed":["Exposure and callable spans","Suitable controls and independence audit","Held-out datasets"],"first_experiment":"Fit Poisson and NB models on training cells and compare held-out zero rates by exposure.","success":"Predictive calibration and stable relative effects across datasets."},"cautions":["Accessibility, mappability and dosage "Proposed regional allele evidence accounts for overdispersion and unknown phase.","steps":[{"title":"Audit allele counts","text":"Join cells by barcode and retain HA, HB and AT with callable masks; AT=0 supplies no allele fraction."},{"title":"Establish orientation","text":"Determine SNP phase sets and orientation; model switches or avoid pooling blocks whose orientation is unknown."},{"title":"Condition on total","text":"For A count k out of n, a binomial model assumes independent trials with fixed fraction p; a beta-binomial allows p to vary according to a beta distribution."},{"title":"Estimate uncertainty","text":"Use an appropriate prior or fit dispersion from sufficient data, accounting for bias and ascertainment; sparse observations give broad intervals."},{"title":"Interpret alongside depth","text":"Report allele imbalance and its uncertainty separately from dosage unless a justified joint measurement model is available."}],"example":{"title":"Four allele observations","setup":"In one oriented block, HA=3 and HB=1, so AT=4 and the observed HA fraction is 0.75.","steps":["Under a binomial model with p=0.5, exactly three HA counts occur with probability 4/16 = 0.25.","A beta-binomial permits extra variation and can make extreme counts more plausible than a fixed-p binomial.","With AT=0 the fraction is undefined, not 0.5."],"interpretation":"Four observations give weak evidence; this example is not a fitted or calibrated test."},"adaptation":{"stage":"alleles","available":["HA, HB and AT matrices"],"needed":["Phase-set orientation","Bias controls, SNP ascertainment and count-unit audit","Independent calibration"],"first_experiment":"Measure phase continuity and simulate power across plausible coverage and dispersion.","success":"Intervals and false-positive rates are calibrated, with explicit insufficient-evidence outcomes."},"cautions":["One molecule may contribute to multiple SNP sites; counts are not automatically independent trials.","Opposing haplotype orientations or mixed states can cancel imbalance.","Allele fraction alone cannot identify a 0:0 state."],"sources":[{"title":"Haplotype-aware analysis of somatic copy number variations","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10289836/"},{"title":"Numbat-multiome","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12531993/"}],"demo":"alleles","record":{"name":"Phase-aware beta-binomial allele model","assay":"Numbat published for scRNA; proposed transfer to scATAC","inputs":"Phased allele observations and total allele counts, phase-set confidence, bias controls","outputs":"Haplotype fraction with interval and power against a specified imbalance; no allele data means no inference","mechanism":"Beta-binomial for counts given total with overdispersion; phase-switch error and heterogeneous mixtures require explicit modeling","reference_requirements":"No normal assumption for relative imbalance; calibrated baseline and SNP ascertainment remain necessary","low_coverage_handling":"AT=0 gives no allele-fraction information; finite counts yield wide uncertainty","homozygous_deletion":"Cannot identify 0:0 from allele fraction without independent dosage evidence","evidence":{"original_review":"Numbat evaluated on scRNA; scATAC transfer untested","coordinator_update":"Numbat-multiome 2025 provides scATAC evaluation of the joint model family; a new regional test on this dataset remains exploratory."},"fit":"HA/HB/AT present but phase orientation, count units and SNP selection not verified","limitations":["Overdispersion may be unidentifiable at sparse coverage","Mixing opposing states cancels signal","AT and raw depth may share fragments"],"source_ids":["numbat","alleloscope","numbat_multiome_coordinator"],"uncertain":["Observed per-region power and phase-set validity unknown"],"implementation":{"code_url":null,"version_or_commit":null,"license":null,"license_url":null,"compute_notes":"Small region-level fits are feasible in principle; no implementation or benchmark run."}},"originalName":"Phase-aware beta-binomial allele model","kind":"Statistical model"},{"id":"E3","name":"Hurdle, zero-inflated NB or latent count mixtures","category":"E","tagline":"Proposed alternatives separate zero mechanisms only when diagnostics justify the complexity.","steps":[{"title":"Fit baseline models","text":"Start with exposure-adjusted Poisson and negative binomial predictive checks, including zeros by exposure."},{"title":"Define a ZINB model","text":"A zero-inflated negative binomial mixes a point mass at zero with an NB distribution; either component can produce an observed zero."},{"title":"Define a hurdle model","text":"A hurdle model separately models zero versus positive occurrence, then models positive counts with a zero-truncated distribution."},{"title":"Compare held-out predictions","text":"Assess calibration, stability and predictive performance across cells and independent datasets; low means and heterogeneity can already produce many zeros."},{"title":"Calibrate comparisons","text":"Mixture parameters can be unidentified or on a boundary, so ordinary chi-square likelihood-ratio approximations may fail; use a justified calibrated procedure."}],"example":{"title":"Two ways to generate zero","setup":"Suppose a ZINB model assigns point-mass probability 0.2 and its NB component predicts zero probability 0.5.","steps":["The total zero probability is 0.2 + 0.8 × 0.5 = 0.6.","In a hurdle model with zero probability 0.6, the positive-count component is conditional on being positive.","Both predict 60% zeros but tell different stories about positive counts."],"interpretation":"Equal zero rates do not establish the same mechanism; these values are illustrative, not fitted."},"adaptation":{"stage":"validate","available":["Raw counts","Potential exposure covariates"],"needed":["Held-out cells and replicates","Technical controls","Mixture identifiability and calibrated model comparison"],"first_experiment":"Compare baseline NB and alternative predictive distributions on held-out data before interpreting components.","success":"Improved reproducible calibration without unstable parameters; biological labels require independent evidence."},"cautions":["A statistical zero component is not proof of biallelic deletion.","Small means and unmodeled heterogeneity can mimic excess zeros.","Component interpretation and significance are sensitive to model assumptions."],"sources":[{"title":"Bayesian model selection reveals biological origins of zero inflation","url":"https://link.springer.com/article/10.1186/s13059-020-02103-2"},{"title":"Modified likelihood ratio test in finite mixture models","url":"https://www.sciencedirect.com/science/article/abs/pii/S0378375804001569"}],"demo":"zeros","record":{"name":"Hurdle, zero-inflated NB or latent count mixtures","assay":"General statistical alternatives; exploratory transfer","inputs":"Same raw-count inputs and fitted baseline; technical controls and replicated datasets","outputs":"Predictive distribution and latent mixture uncertainty, not biological deletion classification","mechanism":"Separate probability of zero or mixture component; assess held-out predictions and model-based calibration","reference_requirements":"Component labels need external biological validation and identifiability","low_coverage_handling":"Extra zeros depend on the null model; small means and heterogeneity can mimic a zero component","homozygous_deletion":"A zero component is not proof of biallelic loss","evidence":"Zero-inflation evidence shown in scRNA; mixture asymptotic issues general","fit":"Consider only after baseline checks identify systematic misfit","limitations":["Boundary and unidentified parameters invalidate naive chi-square LRT","Component instability and count confounding","No orthogonal truth"],"source_ids":["choi","chen"],"uncertain":["Bootstrap calibration and stability under model misspecification remain untested"],"implementation":{"code_url":null,"version_or_commit":null,"license"   <script>(() => {
'use strict';

const safeUrl=url=>{try{const u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:'#';}catch{return '#';}};

function readHash(){const p=new URLSearchParams(location.hash.slice(1));if(['methods','examples','pilot','workflow','compare'].includes(p.get('view')))state.view=p.get('view');if(getMethod(p.get('id')))state.id=p.get('id');if(Object.keys(panelLabel).includes(p.get('panel')))state.panel=p.get('panel');if(['depth','reference','alleles','zeros'].includes(p.get('lab')))state.lab=p.get('lab');}

function renderSidebar(){const items=filtered();$('#method-count').textContent=`${items.length} entries`;$('#method-list').innerHTML=Object.entries(categories).map(([key,title])=>{const group=items.filter(m=>m.category===key);return group.length?`<div class="group-title"><span>${esc(title)}</span><span>${group.length}</span></div>${group.map(m=>`<button class="method-button ${state.id===m.id&&state.view==='methods'?'active':''}" data-method="${m.id}" ${state.id===m.id&&state.view==='methods'?'aria-current="page"':''}><span class="method-code">${m.id}</span><span>${esc(m.name)}</span></button>`).join('')}`:'';}).join('')||'<p class="no-results">No matching entries. Try a broader term.</p>';}
