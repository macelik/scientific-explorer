function adaptation(m){return `<span class="badge neutral">PROPOSED ADAPTATION</span><div class="adapt-section" style="border-top:0"><h2>${esc(stageNames[m.adaptation.stage])}</h2><p>Where this method could enter our workflow.</p></div><div class="adapt-grid"><div><h3>Already available</h3>${list(m.adaptation.available)}</div><div><h3>Still needed</h3>${list(m.adaptation.needed)}</div></div><div class="adapt-section"><h3>First experiment</h3><p>${esc(m.adaptation.first_experiment)}</p></div><div class="adapt-section"><h3>What would justify continuing</h3><p>${esc(m.adaptation.success)}</p></div><button class="quiet" data-workflow="${m.adaptation.stage}">Locate this in the workflow →</button>`;}
function methodView(){const m=getMethod(state.id);if(!filtered().length)return `<section class="empty"><h1>No matching methods</h1><p>Search names or concepts such as “phasing”, “reference”, “GC” or “HMM”.</p><button class="primary" data-action="clear-search">Clear filters</button></section>`;const pinned=state.compare.includes(m.id);const record=m.record;return `${top(`${m.id} / ${esc(categories[m.category])}`,`<button class="quiet" data-pin="${m.id}" aria-pressed="${pinned}">${pinned?'✓ Added to comparison':'+ Compare'}</button><button class="quiet" data-action="export">Save notes</button>`)}<h1>${esc(m.name)}</h1><p class="lead">${esc(m.tagline)}</p><div class="meta-line">${methodBadge(m)}<span>${esc(categories[m.category])}</span><span>${m.steps.length} inference steps</span></div><div class="subnav" role="group" aria-label="Method explanation">${Object.entries(panelLabel).map(([p,t])=>`<button class="${state.panel===p?'active':''}" data-panel="${p}" aria-pressed="${state.panel===p}">${t}</button>`).join('')}</div><div class="method-body"><article>${state.panel==='mechanism'?mechanism(m):state.panel==='example'?example(m):adaptation(m)}</article><aside class="inspector" aria-label="Inputs and outputs"><section><h3>Designed for</h3><p>${esc(flatten(record.assay))}</p></section><section><h3>Inputs</h3><p>${esc(flatten(record.inputs))}</p></section><section><h3>Returns</h3><p>${esc(flatten(record.outputs))}</p></section><section><h3>License / availability</h3><p>${esc(flatten(record.implementation.license))}</p><p class="muted">Research snapshot; verify version and terms before reuse.</p></section></aside></div><div class="sources"><span class="eyebrow">FOLLOW THE EVIDENCE</span><div class="source-links">${m.sources.map(s=>link(s.url,s.title)).join('')}</div><p class="small muted" style="margin-top:9px">Sources support the mechanism. The worked example and workflow adaptation are teaching/proposed material.</p></div><details class="raw-record"><summary>Research record, limitations and unresolved questions</summary>${['mechanism','reference_requirements','low_coverage_handling','homozygous_deletion','evidence','fit','limitations','uncertain','implementation'].map(k=>`<div class="record-field"><strong>${esc(k.replaceAll('_',' '))}</strong>${esc(flatten(record[k]))}</div>`).join('')}</details><div class="method-nav-bottom"><button data-action="previous-method">← Previous entry</button><button data-action="next-method">Next entry →</button></div>${footer()}`;}

// Teaching calculations only. Deterministic expectations and numerical quadrature;
// no sampling, no trained caller, and no modification of the repository's statistics.
function countDistribution(model,mu,r,pi){const p=Array(16);p[0]=model==='poisson'?Math.exp(-mu):Math.pow(r/(r+mu),r);for(let k=1;k<16;k++)p[k]=model==='poisson'?p[k-1]*mu/k:p[k-1]*(k+r-1)/k*mu/(r+mu);if(model==='zinb'){for(let k=1;k<16;k++)p[k]*=1-pi;p[0]=pi+(1-pi)*p[0];}p.push(Math.max(0,1-p.reduce((a,b)=>a+b,0)));return p;}
function allelePosterior(n,hb){const size=4000,logs=[];for(let i=0;i<size;i++){const p=(i+.5)/size;logs.push(hb*Math.log(p)+(n-hb)*Math.log1p(-p));}const max=Math.max(...logs),weights=logs.map(x=>Math.exp(x-max)),sum=weights.reduce((a,b)=>a+b,0);let c=0,lo=null,hi=null;const points=[];for(let i=0;i<size;i++){c+=weights[i]/sum;if(lo===null&&c>=.025)lo=(i+.5)/size;if(hi===null&&c>=.975)hi=(i+.5)/size;if(i%10===0)points.push([(i+.5)/size,weights[i]/sum*size]);}return {mean:(hb+1)/(n+2),low:lo,high:hi,points};}
function depthProfile(copy,access,reference){return Array.from({length:60},(_,i)=>{const base=1+.08*Math.sin(i*.72)+.035*Math.cos(i*1.43);return [i,base*(i>=20&&i<40?copy*access:1)/reference];});}
window.GuideMath={countDistribution,allelePosterior,depthProfile};
function axisSvg(title,yLabel,maxY,inside,xLabels=['0','1']){return `<svg viewBox="0 0 620 310" role="img" aria-label="${esc(title)}"><title>${esc(title)}</title><text class="chart-label" x="48" y="18">${esc(yLabel)}</text>${[0,.25,.5,.75,1].map(q=>`<line x1="48" y1="${265-q*220}" x2="595" y2="${265-q*220}" stroke="#d9dfd8" stroke-width="1"/><text class="chart-label" text-anchor="end" x="39" y="${269-q*220}">${fmt(maxY*q,maxY>5?0:2)}</text>`).join('')}${inside}<line x1="48" y1="265" x2="595" y2="265" stroke="#65726c"/><text class="chart-label" x="48" y="291">${esc(xLabels[0])}</text><text class="chart-label" x="595" y="291" text-anchor="end">${esc(xLabels[1])}</text></svg>`;}
function range(id,label,min,max,step,value,note){return `<div class="control"><label for="${id}">${label}<output id="${id}-output" for="${id}">${fmt(value,step<1?2:0)}</output></label><input id="${id}" data-control="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${value}"><small>${note}</small></div>`;}
function readout(label,value){return `<div class="readout"><small>${label}</small><strong>${value}</strong></div>`;}
function labControls(){if(state.lab==='depth'||state.lab==='reference')return `${range('copy','Copy-related multiplier',.2,2,.05,state.copy,'1 = unchanged dosage in this idealized example.')}${range('access','Accessibility multiplier',.2,2,.05,state.access,'A separate cause of coverage change.')}${range('reference','Reference level',.5,1.5,.05,state.reference,'Changing the baseline changes the displayed ratio.')}<div class="presets"><button data-preset="copy">Copy decrease</button><button data-preset="access">Accessibility decrease</button><button data-preset="reference">Change reference</button></div>`;if(state.lab==='alleles')return `${range('n','Independent observations',0,200,1,state.n,'Teaching assumption: independent, correctly phased observations.')}${range('fraction','Requested HB fraction',0,1,.05,state.fraction,'HB is rounded to an integer; the realized fraction is shown.')}<div class="presets"><button data-preset="no-alleles">No observations</button><button data-preset="few-alleles">4 observations</button><button data-preset="many-alleles">100 observations</button></div>`;return `<div class="control"><label for="count-model">Count model</label><select id="count-model"><option value="poisson" ${state.model==='poisson'?'selected':''}>Poisson</option><option value="nb" ${state.model==='nb'?'selected':''}>Negative binomial</option><option value="zinb" ${state.model==='zinb'?'selected':''}>Zero-inflated negative binomial</option></select></div>${range('mu','Count-component mean μ',.1,12,.1,state.mu,'Before adding any extra-zero component.')}${range('r','NB size r',.2,40,.2,state.r,'Smaller r gives more dispersion. Not used for Poisson.')}${range('pi','Extra-zero probability π',0,.8,.05,state.pi,'Assumed mixture component; only used in zero-inflated NB.')}`;}
const labCopy={depth:['Why a depth dip is ambiguous','Change copy-related dosage or accessibility and compare the resulting expected profile.'],reference:['The baseline changes the contrast','An identical target profile can look different against a different reference.'],alleles:['The same fraction, different evidence','Keep the observed allele fraction similar while changing the amount of information.'],zeros:['Zeros depend on the count model','Low expected counts and overdispersion can produce many zeros without an extra-zero component.']};
function examplesView(){const [title,intro]=labCopy[state.lab];return `${top('CONCEPT LAB / DETERMINISTIC TEACHING EXAMPLES')}<h1>${title}</h1><p class="lead">${intro}</p><div class="lab-tabs" role="group" aria-label="Interactive example">${[['depth','Depth ambiguity'],['reference','Reference choice'],['alleles','Allelic information'],['zeros','Zero counts']].map(([k,v])=>`<button class="${state.lab===k?'active':''}" data-lab="${k}" aria-pressed="${state.lab===k}">${v}</button>`).join('')}</div><span class="badge neutral">ILLUSTRATIVE MODEL · NO DATA FIT</span><div class="lab-grid"><div class="controls">${labControls()}</div><div class="chart-wrap"><div id="lab-chart"></div><div id="lab-readouts" class="readouts" aria-live="polite"></div></div></div><div id="lab-equation" class="equation"></div><p id="lab-note" class="demo-note"></p><div id="lab-related" class="related"></div><p class="small muted" style="margin-top:20px">Teaching distribution definitions: ${link("https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.poisson.html","Poisson")}, ${link("https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.nbinom.html","negative binomial")}, ${link("https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.beta.html","Beta")}.</p>${footer()}`;}
function updateLab(){let chart,stats,equation,note,related;if(state.lab==='depth'||state.lab==='reference'){const points=depthProfile(state.copy,state.access,state.reference),max=Math.max(1.4,...points.map(p=>p[1]))*1.12;const path=points.map(([x,y],i)=>`${i?'L':'M'}${48+x/59*547},${265-y/max*220}`).join(' ');const shade=`<rect x="${48+20/59*547}" y="36" width="${19/59*547}" height="229" fill="#e4efea"/><text x="${48+29.5/59*547}" y="31" text-anchor="middle" class="chart-label">candidate region</text>`;chart=axisSvg('Expected relative depth under copy, accessibility and reference assumptions','Expected relative depth',max,shade+`<path d="${path}" fill="none" stroke="#126657" stroke-width="2.5"/>`,['Ordered genomic bins','60']);stats=readout('Target multiplier before reference',`${fmt(state.copy*state.access)}×`)+readout('Target factor / reference',`${fmt(state.copy*state.access/state.reference)}×`);equation='Expected depth ∝ exposure × accessibility × dosage. Displayed factor = dosage multiplier × accessibility multiplier ÷ reference level.';note='The curve is a deterministic expected profile with a fixed background pattern, not simulated reads or an AD segmentation. “Copy decrease” (0.5 × 1) and “Accessibility decrease” (1 × 0.5) produce exactly the same curve. Depth alone cannot distinguish these two constructions. A normalized ratio is not an absolute copy state.';related=['A1','A4','B2','C3'];}
else if(state.lab==='alleles'){const hb=Math.round(state.n*state.fraction),ha=state.n-hb,p=allelePosterior(state.n,hb),max=Math.max(...p.points.map(q=>q[1]))*1.12;const path=p.points.map(([x,y],i)=>`${i?'L':'M'}${48+x*547},${265-y/max*220}`).join(' ');chart=axisSvg('Illustrative posterior density for the HB fraction','Posterior density',max,`<rect x="${48+p.low*547}" y="45" width="${(p.high-p.low)*547}" height="220" fill="#e4efea"/><line x1="321.5" y1="45" x2="321.5" y2="265" stroke="#9b8662" stroke-dasharray="4 4"/><path d="${path}" fill="none" stroke="${state.n?'#126657':'#89988f'}" stroke-width="2.5"/>`,['HB fraction 0','1']);stats=readout('HA / HB observations',`${ha} / ${hb}`)+readout('Realized HB fraction',state.n?fmt(hb/state.n):'Undefined')+readout(state.n?'Approx. 95% credible interval':'Evidence status',state.n?`${fmt(p.low)}–${fmt(p.high)}`:'Prior only');equation=`HB | p, n ~ Binomial(n, p); p ~ Beta(1, 1); p | observations ~ Beta(HB + 1, HA + 1). Here: Beta(${hb+1}, ${ha+1}).`;note=state.n?'Shading is an approximate central Bayesian credible interval under the displayed model, not a frequentist confidence interval or calibrated LOH test. A uniform prior and independent, correctly phased observations are assumed; extra dispersion, mapping bias and phase errors are omitted. Our AT site counts are not automatically independent trials. This is not the beta-binomial emission or full inference used by Numbat.':'With no observations the curve is just the uniform prior. It provides no data-supported allele fraction and is not evidence for balance. Never convert absent allelic counts into an observed 50:50 measurement.';related=['A3','B1','E2','F1'];}
else{const p=countDistribution(state.model,state.mu,state.r,state.pi),max=Math.max(...p)*1.13;let bars='';p.forEach((v,i)=>{const x=48+i*547/17;bars+=`<rect x="${x+3}" y="${265-v/max*220}" width="${547/17-6}" height="${v/max*220}" fill="${i===0?'#126657':'#89988f'}"><title>${i===16?'16 or more':i} observations: ${pct(v)}</title></rect>`;if(i%2===0)bars+=`<text x="${x+547/34}" y="283" text-anchor="middle" class="chart-label">${i===16?'≥16':i}</text>`;});chart=axisSvg('Count probabilities, including tail at 16 or more','Probability',max,bars,['','']);stats=readout('Probability of zero',pct(p[0]))+readout('Expected zeros / 300 observations',fmt(300*p[0],1))+readout('Mixture mean',fmt(state.model==='zinb'?(1-state.pi)*state.mu:state.mu));equation=state.model==='poisson'?'Poisson: Var(Y) = μ; P(Y = 0) = exp(−μ).':state.model==='nb'?'NB2 parameterization: Var(Y) = μ + μ²/r; P(Y = 0) = [r / (r + μ)]ʳ.':'Zero-inflated NB: P(Y = 0) = π + (1 − π) × [r / (r + μ)]ʳ. Overall mean = (1 − π)μ.';note='Bars show exact distribution probabilities, not sampled cells or a fit to MCF10-A. π is an assumed extra-zero component, not an estimated deletion fraction. More zeros than a Poisson prediction can come from ordinary overdispersion. A zero-inflated model is distinct from a hurdle model, whose positive-count component is zero-truncated.';related=['E1','E3','F2'];$('#r').disabled=state.model==='poisson';$('#pi').disabled=state.model!=='zinb';}
$('#lab-chart').innerHTML=chart;$('#lab-readouts').innerHTML=stats;$('#lab-equation').textContent=equation;$('#lab-note').textContent=note;$('#lab-related').innerHTML=related.map(id=>`<button data-method="${id}">${id} · ${esc(getMethod(id).name)} →</button>`).join('');}
function pilotLabel(id){return id.replace('chr','Chr ').replaceAll('_',' · ');}
function pilotView(){const options=DATA.pilot.filter(r=>r.stratum==='all').map(r=>r.region);const strata=[['all:all','All 300 cells'],['coverage_tercile:low','Low coverage · 100 cells'],['coverage_tercile:mid','Mid coverage · 100 cells'],['coverage_tercile:high','High coverage · 100 cells'],...Array.from({length:5},(_,i)=>[`cluster:${i}`,`WNN cluster ${i}`])];return `${top('OBSERVED DATA / SAVED DESCRIPTIVE PILOT')}<h1>What the 300-cell panel can tell us</h1><p class="lead">Inspect measured zeros and allelic support across regions, coverage strata and clusters. These are saved summaries, not inferred copy states.</p><div class="selectors"><label for="pilot-region">Candidate window<select id="pilot-region">${options.map(id=>`<option value="${id}" ${state.region===id?'selected':''}>${pilotLabel(id)} Mb</option>`).join('')}</select></label><label for="pilot-stratum">Cells to inspect<select id="pilot-stratum">${strata.map(([id,t])=>`<option value="${id}" ${state.stratum===id?'selected':''}>${t}</option>`).join('')}</select></label></div><div id="pilot-output" aria-live="polite"></div><div class="callout"><strong>Interpretation boundary</strong><p>Many empty bins do not imply an empty region. Nonzero counts somewhere in a broad window do not exclude a smaller deletion inside it. Zero inflation, statistical power and biological CN were not fitted or established in this pilot.</p></div><details><summary>All windows · full 300-cell panel</summary><div class="table-wrap"><table><thead><tr><th>Window (Mb)</th><th>Retained bins</th><th>Raw-zero cells</th><th>AT-zero cells</th><th>Median AT</th></tr></thead><tbody>${DATA.pilot.filter(r=>r.stratum==='all').map(r=>`<tr><td>${pilotLabel(r.region)}</td><td>${r.n_bins}</td><td>${r.raw_whole_zero_cells}/300</td><td>${r.at_whole_zero_cells}/300</td><td>${r.at_sum_median}</td></tr>`).join('')}</tbody></table></div></details><div class="sources"><span class="eyebrow">PROVENANCE</span><p style="margin-top:10px">Existing panel: 100 cells per coverage tercile. Fixed membership, no fresh random draw and no cohort refiltering. All 300 barcodes, bin coordinates and AT = HA + HB were checked. Historical sampling seed was not verified; this export is deterministic. The panel is not an independent validation dataset.</p><p style="margin-top:10px">Saved summaries: E / zero_support_by_stratum.tsv. Source hash: <code>${esc(DATA.pilotHash.slice(0,16))}…</code>. Raw counts and processed X are distinct. AT denotes selected SNP-site observations; duplicate molecules and phase consistency remain unresolved.</p></div>${footer()}`;}
function updatePilot(){const [stratum,level]=state.stratum.split(':');const r=DATA.pilot.find(x=>x.region===state.region&&x.stratum===stratum&&String(x.level)===level);if(!r){$('#pilot-output').innerHTML='<p>No saved summary for this selection.</p>';return;}const bar=(name,n,secondary)=>`<div class="bar-row"><span>${name}</span><div class="bar-track"><div class="bar-fill ${secondary?'secondary':''}" style="width:${100*n/r.n_cells}%"></div></div><span>${n} / ${r.n_cells}</span></div>`;$('#pilot-output').innerHTML=`<div class="pilot-summary"><div><strong>${r.n_cells}</strong><small>cells in this view</small></div><div><strong>${r.n_bins}</strong><small>retained 100 kb bins</small></div><div><strong>${fmt(r.at_sum_median,0)}</strong><small>median per-cell window AT</small></div></div><h3>Cells with no observations across the whole window</h3>${bar('Raw count = 0',r.raw_whole_zero_cells,false)}${bar('AT = 0',r.at_whole_zero_cells,true)}<div class="readouts">${readout('Raw-zero bin fraction',pct(r.raw_zero_bin_fraction))}${readout('AT-zero bin fraction',pct(r.at_zero_bin_fraction))}${readout('Cells with window AT ≥ 10',`${r.cells_at_ge10} / ${r.n_cells}`)}</div><p class="table-note">Bin fractions pool cell × retained-bin observations within this view. Window AT ≥ 10 is a descriptive threshold here; it is not the app’s per-bin pseudobulk filter.</p>`;}
const workflowInfo={inputs:['What are the observations?','Start with layers/raw, processed X, HA/HB/AT and coordinates. Resolve observation units, barcode joins, SNP ascertainment and orientation. A selected SNP-site count is not automatically one independent fragment.','Existing: aligned matrices and the shared panel. Next: trace source observations and phase metadata.'],reference:['What is the baseline?','Use independently supported internal controls if suitable; otherwise assess compatible external controls. If neither is defensible, retain relative comparisons and show baseline sensitivity. MCF10-A identity does not establish a diploid reference.','Existing: relative pyEpi scale. Proposed: explicit reference eligibility and a “no reliable reference” outcome.'],segment:['Where does the depth change?','Keep the current recursive AD scan and permutation procedure as the baseline. Compare proposed count-based segmentation only in a separate experiment, with exposure, callable masks and true genomic distances.','Existing: cluster pseudobulk segmentation and optional exploratory merge rounds. No pipeline replacement is performed here.'],alleles:['Is an allelic hypothesis distinguishable?','Use phase-valid observations to assess a specified allele-fraction hypothesis with uncertainty. Missing observations produce no allelic evidence; pooling is useful only under justified phase and mixture assumptions.','Existing: masked allele tracks. Proposed: coverage/power assessment and explicit insufficient-evidence states.'],interpret:['Which explanations remain possible?','Distinguish a relative depth dip, an imbalance-compatible observation and an absolute copy-state claim. Accessibility, shared events, ploidy and mixtures can leave more than one explanation.','Proposed: present depth support, allele support, reference dependence and unresolved alternatives separately.'],validate:['Does the approach generalize?','Use independent DNA characterization and held-out samples across coverage, event sizes and reference availability. Caller agreement, simulations and repeated views of the same cells are different evidence categories.','Next: reproduce a published comparator, then measure focal sensitivity, false calls and uncertainty calibration.']};
function workflowView(){const [title,text,note]=workflowInfo[state.workflow];const matching=DATA.methods.filter(m=>m.adaptation.stage===state.workflow);return `${top('METHOD DEVELOPMENT / WHERE EACH IDEA FITS')}<h1>Keep observations, models and conclusions separate</h1><p class="lead">Select a stage to see what exists today, what needs evidence, and which methods could help.</p><div class="workflow-map">${Object.keys(stageNames).map((k,i)=>`<button class="workflow-step ${state.workflow===k?'active':''}" data-workflow="${k}" aria-pressed="${state.workflow===k}"><span>0${i+1}</span><h3>${stageNames[k]}</h3><p>${workflowInfo[k][0]}</p></button>`).join('')}</div><section class="workflow-detail"><h2>${title}</h2><p>${text}</p><div class="callout">${note}</div><h3>Methods associated with this stage</h3><div class="workflow-methods">${matching.length?matching.map(m=>`<button data-method="${m.id}"><span class="method-code">${m.id}</span><span>${esc(m.name)}</span><span style="margin-left:auto">→</span></button>`).join(''):'<p>No single method owns this stage. It is a requirement across the workflow.</p>'}</div></section><div class="sources"><span class="eyebrow">RECOMMENDED SEQUENCE</span><ol class="steps-list"><li>Audit count units, ascertainment and phase continuity.</li><li>Compare fixed-region raw count baselines and allele information.</li><li>Assess Numbat-multiome prerequisites and an independent benchmark.</li><li>Add priors or representations only for a demonstrated gap.</li></ol></div>${footer()}`;}
function compareView(){const methods=state.compare.map(getMethod);return `${top('SIDE-BY-SIDE / ASSUMPTIONS BEFORE PERFORMANCE',`<button class="quiet" data-action="clear-compare">Clear comparison</button>`)}<h1>Compare what each method needs</h1><p class="lead">Choose up to three library entries. Compare measurements, assumptions and proposed use—not unmeasured performance scores.</p>${methods.length?`<div class="compare-grid">${methods.map(m=>`<article class="compare-column"><button class="quiet" data-pin="${m.id}">Remove ${m.id} ×</button><h2>${esc(m.name)}</h2>${methodBadge(m)}<h3>Mechanism</h3><p>${esc(m.tagline)}</p><h3>Required inputs</h3><p>${esc(flatten(m.record.inputs))}</p><h3>Reference assumptions</h3><p>${esc(flatten(m.record.reference_requirements))}</p><h3>What it returns</h3><p>${esc(flatten(m.record.outputs))}</p><h3>Missing locally</h3>${list(m.adaptation.needed)}<h3>First experiment</h3><p>${esc(m.adaptation.first_experiment)}</p><h3>License</h3><p>${esc(flatten(m.record.implementation.license))}</p><button class="primary" style="margin-top:20px" data-method="${m.id}">Read explanation →</button></article>`).join('')}</div>`:`<div class="empty"><h2>Start with the current baseline and two comparators.</h2><p>Add methods from their explanation page, or use this suggested comparison.</p><button class="primary" data-action="suggest-compare">Compare pyEpi, Numbat and Alleloscope</button></div>`}${footer()}`;}
function render(){renderSidebar();document.querySelectorAll('[data-view]').forEach(b=>{const active=b.dataset.view===state.view;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});$('#compare-count').textContent=state.compare.length;$('#main').innerHTML=`<div class="view-content">${({methods:methodView,examples:examplesView,pilot:pilotView,workflow:workflowView,compare:compareView}[state.view])()}</div>`;if(state.view==='examples')updateLab();if(state.view==='pilot')updatePilot();writeHash();}
function pin(id){if(state.compare.includes(id)){state.compare=state.compare.filter(x=>x!==id);toast('Removed from comparison.');}else if(state.compare.length>=3){toast('Compare up to three entries. Remove one first.');return;}else{state.compare.push(id);toast('Added to comparison.');}render();}
function exportNotes(){const m=getMethod(state.id);const text=`# ${m.name}\n\n${m.tagline}\n\n## How it works\n${m.steps.map((s,i)=>`${i+1}. ${s.title}: ${s.text}`).join('\n')}\n\n## Illustrative example — not a tool run\n${m.example.title}\n\n${m.example.setup}\n${m.example.steps.map(s=>'- '+s).join('\n')}\n\n${m.example.interpretation}\n\n## Proposed adaptation\nStage: ${stageNames[m.adaptation.stage]}\n\nAvailable:\n${m.adaptation.available.map(s=>'- '+s).join('\n')}\n\nNeeded:\n${m.adaptation.needed.map(s=>'- '+s).join('\n')}\n\nFirst experiment: ${m.adaptation.first_experiment}\n\nSuccess: ${m.adaptation.success}\n\n## Limitations\n${m.cautions.map(s=>'- '+s).join('\n')}\n\n## Sources\n${m.sources.map(s=>`- [${s.title}](${s.url})`).join('\n')}\n\nScientific Explorer research guide · 2026-11-02. MCF10-A is development data, not CN ground truth.\n`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/markdown'}));a.download=`${m.id}-${m.name.replace(/[^a-z0-9]+/gi,'-')}.md`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.view){state.view=b.dataset.view;render();window.scrollTo({top:0,behavior:'instant'});return;}if(b.dataset.method){selectMethod(b.dataset.method);return;}if(b.dataset.panel){state.panel=b.dataset.panel;render();$(`[data-panel="${state.panel}"]`).focus({preventScroll:true});return;}if(b.dataset.step!==undefined){state.step=Number(b.dataset.step);render();$(`.stage-node[data-step="${state.step}"]`).focus({preventScroll:true});return;}if(b.dataset.pin){pin(b.dataset.pin);return;}if(b.dataset.lab){state.lab=b.dataset.lab;state.view='examples';render();return;}if(b.dataset.workflow){state.workflow=b.dataset.workflow;state.view='workflow';render();return;}if(b.dataset.preset){const preset=b.dataset.preset;if(preset==='copy'){state.copy=.5;state.access=1;state.reference=1;}if(preset==='access'){state.copy=1;state.access=.5;state.reference=1;}if(preset==='reference'){state.copy=.5;state.access=1;state.reference=1.5;}if(preset==='no-alleles')state.n=0;if(preset==='few-alleles'){state.n=4;state.fraction=.75;}if(preset==='many-alleles'){state.n=100;state.fraction=.75;}render();return;}switch(b.dataset.action){case'print':document.querySelectorAll('.steps-all').forEach(d=>d.open=true);window.print();break;case'export':exportNotes();break;case'clear-search':state.query='';state.category='all';$('#search').value='';$('#category').value='all';render();break;case'clear-compare':state.compare=[];render();break;case'suggest-compare':state.compare=['A1','A4','A3'];render();break;case'previous-method':case'next-method':{const items=filtered(),i=items.findIndex(m=>m.id===state.id),delta=b.dataset.action==='next-method'?1:-1;selectMethod(items[(i+delta+items.length)%items.length].id);break;}}});
document.addEventListener('input',e=>{const key=e.target.dataset.control;if(key){state[key]=Number(e.target.value);$(`#${key}-output`).textContent=fmt(state[key],key==='n'?0:2);updateLab();}});
document.addEventListener('change',e=>{if(e.target.id==='count-model'){state.model=e.target.value;updateLab();}if(e.target.id==='pilot-region'){state.region=e.target.value;updatePilot();}if(e.target.id==='pilot-stratum'){state.stratum=e.target.value;updatePilot();}});
$('#search').addEventListener('input',e=>{state.query=e.target.value;state.view='methods';const matches=filtered();if(matches.length&&!matches.some(m=>m.id===state.id)){state.id=matches[0].id;state.step=0;}render();});
$('#category').innerHTML+=Object.entries(categories).map(([key,title])=>`<option value="${key}">${title}</option>`).join('');
$('#category').addEventListener('change',e=>{state.category=e.target.value;state.view='methods';const matches=filtered();if(matches.length){state.id=matches[0].id;state.step=0;}render();});
const glossary={'CNV / CNA':'Copy-number variation / alteration: a change in DNA dosage. In this guide, relative-depth signals and absolute allele-specific states are distinguished.','GC / LOESS':'GC is the proportion of guanine and cytosine bases. LOESS fits local smooth trends, used here to describe depth dependence on GC without interpreting the fitted trend as a copy state.','CBS / PELT / ASPCF':'CBS searches for distribution changes by circular binary segmentation. PELT optimizes a chosen segment cost plus a changepoint penalty. ASPCF performs allele-specific piecewise constant fitting. They are different segmentation procedures.','VAE / latent representation':'A variational autoencoder learns a compact probabilistic representation and a decoder that reconstructs observations. A learned coordinate or cluster is not automatically a CN state.','Transformer / attention / Mamba':'Attention combines information from related tokens. Transformers use attention blocks; Mamba uses a selective state-space sequence model. Their learned representations depend on the training data and objective.','Beta-binomial / binomial-Beta posterior':'A beta-binomial emission allows an underlying success fraction to vary between sets of observations according to a Beta distribution. The teaching lab instead uses a fixed-fraction binomial likelihood and a Beta prior to show posterior uncertainty.','Exposure / callable span':'Exposure describes the opportunity to observe counts, such as library size. Callable span is the portion of a region with usable measurements; neither should be silently treated as equal across cells or gaps.','Raw counts / processed X':'Raw counts are stored in layers/raw; X is corrected and normalized depth. Count likelihoods require appropriate raw observations, not arbitrary processed values.','HA, HB and AT':'Counts assigned to two phased haplotypes; AT = HA + HB. Here AT sums selected SNP-site observations and is not established as unique-fragment coverage.','dBAF':'(HB − HA) / (2 × AT), when AT > 0. The shrunk absolute track uses |HB − HA| / [2 × (AT + 2)]. These are descriptive signals, not CN probabilities.','AD':'Anderson–Darling distribution-comparison statistic. The current constrained scan uses it with local and global permutation tests; it is not an HMM.','HMM / emission / transition':'A hidden Markov model infers an unobserved sequence of states. Emissions describe observations conditional on a state; transitions describe changes between neighboring states.','LOH':'Loss of heterozygosity: allele-specific change that can occur with or without reduced total copy number. Sparse or absent allele observations do not establish it.','Pseudobulk / WNN':'A pseudobulk aggregates cells. WNN is the weighted-nearest-neighbor integration used to group cells here; those groups are not independently established clones or normal populations.','Overdispersion / structural zero':'Overdispersion is variance above a selected baseline model. A structural-zero mixture component is a model assumption; its existence and biological meaning require evidence.','Reference / diploid anchor':'A reference defines expected observations; an independently defensible diploid anchor links relative observations to absolute copies. Cell-type identity alone does not provide that anchor.','Mask / missing observation':'An excluded or unavailable measurement is different from an observed zero. Neither should silently become a balanced allele observation.','Evidence levels':'Published method behavior, exploratory adaptation, illustrative calculation and observed pilot summaries are different categories. This guide labels them separately.'};
$('#glossary-content').innerHTML=`<dl>${Object.entries(glossary).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
$('.glossary-open').addEventListener('click',()=>$('#glossary').showModal());$('#close-glossary').addEventListener('click',()=>$('#glossary').close());
window.addEventListener('hashchange',()=>{readHash();state.step=0;render();});
readHash();render();
})();
